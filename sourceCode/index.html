<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDoアプリ</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <header>
        <h1>ToDo アプリ</h1>
    </header>

    <!-- フィルター -->
    <div class="controls">

        <label>
            ステータス：
            <select id="filter-status">
                <option value="all">すべて</option>
                <option value="active">未完了</option>
                <option value="completed">完了</option>
            </select>
        </label>

        <label>
            重要度：
            <select id="filter-priority">
                <option value="all">すべて</option>
                <option value="high">高</option>
                <option value="medium">中</option>
                <option value="low">低</option>
            </select>
        </label>

        <label>
            ジャンル：
            <select id="filter-genre">
                <option value="homework">課題</option>
            </select>
        </label>

    </div>

    <p id="error-message" class="error-message"></p>
    <ul id="task-edit" class="task-edit"></ul>
    <ul id="task-list" class="task-list"></ul>

</div>


<!-- モーダル -->
<div id="modal" class="modal hidden">

    <div class="modal-content">

        <button
            type="button"
            id="close-modal"
            class="close-button">
            ×
        </button>
        <h2>タスク追加</h2>
        <form id="task-form" class="task-form">
            <input id="title" type="text" placeholder="タスク名を入力" maxlength="140">
            <input id="note" type="text" placeholder="メモ" maxlength="140">
            <input id="due" type="date">
            <label>
                重要度：
            <select id="task-priority" class="menu">
                <option value="high">高</option>
                <option value="medium" selected>中</option>
                <option value="low">低</option>
            </select>
            </label>
            <label>ジャンル：
                <select id="task-genre">
                    <option value="homework">課題</option>
                    <option value="new">新規作成</option>
                </select>
            </label>
            <label>
                新規ジャンルの追加：
                <input id="new_genre" type="text" placeholder="新規ジャンル名を入力">
            </label>
            <div id="newGenreArea" style="display:none;">
                <input type="text" id="newGenre" placeholder="新しいジャンル名">
                <button type="button" onclick="addGenre()">追加</button>
            </div>
            <button type="submit">追加</button>
        </form>
    </div>

</div>


<!-- 右下の＋ボタン -->
<button
    id="add-button"
    class="floating-button">

    +

</button>


<script src="app.js"></script>

</body>
</html>
