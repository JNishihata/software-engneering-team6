<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDoアプリ</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <header>
        <h1>ToDo アプリ</h1>
    </header>

    <!-- フィルター -->
    <div class="controls">

        <label>
            ステータス：
            <select id="filter">
                <option value="all">すべて</option>
                <option value="active">未完了</option>
                <option value="completed">完了</option>
            </select>
        </label>

        <label>
            重要度：
            <select id="priority-filter">
                <option value="all">すべて</option>
                <option value="low">低</option>
                <option value="medium">中</option>
                <option value="high">高</option>
            </select>
        </label>

        <label>
            ジャンル：
            <select id="genre">
                <option value="homework">課題</option>
            </select>
        </label>

    </div>

    <p id="error-message" class="error-message"></p>
    <ul id="task-edit" class="task-edit"></ul>
    <ul id="task-list" class="task-list"></ul>

</div>


<!-- モーダル -->
<div id="modal" class="modal hidden">

    <div class="modal-content">

        <button
            type="button"
            id="close-modal"
            class="close-button">
            ×
        </button>
        <h2>タスク追加</h2>
        <form id="task-form" class="task-form">
            <input id="title" type="text" placeholder="タスク名を入力" maxlength="140">
            <input id="note" type="text" placeholder="メモ" maxlength="140">
            <input id="due" type="date">
            <label>
                重要度：
            <select id="priority" class="menu">
                <option value="low">低</option>
                <option value="medium" selected>中</option>
                <option value="high">高</option>
            </select>
            </label>
            <label>ジャンル：
                <select id="genre">
                    <option value="homework">課題</option>
                    <button type="submit">追加</button>
                </select>
            </label>
            <div id="newGenreArea" style="display:none; margin-top:10px;">
                <input type="text" id="newGenre" placeholder="新しいジャンル名">
                <button type="button" onclick="addGenre()">追加</button>
            </div>
            <button type="submit">追加</button>
        </form>
    </div>

</div>

<script>
    const genreSelect = document.getElementById("genre");
    const newGenreArea = document.getElementById("newGenreArea");
    // プルダウンが変更されたとき
    genreSelect.addEventListener("change", function (){
        if(this.value === "new"){
            newGenreArea.style.display = "block";
        }else{
            newGenreArea.style.display = "none";
        }
    });

    // 新しいジャンルを追加
    function addGenre(){
        const input = document.getElementById("newGenre");
        const name = input.value.trim();

        if(name===""){
            alert("ジャンル名を入力してください");
            return;
        }

        // 同じジャンルがあるか確認
        for (let option of genreSelect.options){
            if(option.value === name){
                alert("そのジャンルはすでにあります。");
                return;
            }
        }

        // option作成
        const option =document.createElement("option");
        option.value = name;
        option.textContent = name;

        // 「＋新規作成」の前に追加
        genre.Select.insertBefore(option,genreSelect.lastElementChild);

        // 追加したジャンルを選択
        genreSelect.value = name;

        // リセット
        input.value ="";
        newGenreArea.style.display ="none";
    }
</script>

<!-- 右下の＋ボタン -->
<button
    id="add-button"
    class="floating-button">

    +

</button>


<script src="app.js"></script>

</body>
</html>
